name: voice_assistant
description: A new Flutter project.
publish_to: 'none'



version: 1.0.0+1


environment:
  sdk: ^3.12.2
dependencies:
  flutter:
    sdk: flutter
  speech_to_text: ^7.5.0
  injectable: ^3.0.0
  get_it: ^9.2.1
  flutter_bloc : ^8.1.4
  build_runner: ^2.4.8
  dio: ^5.11.1
  flutter_tts: ^4.2.5
  equatable: ^3.0.0



dev_dependencies:
  flutter_test:
    sdk: flutter
  injectable_generator: ^3.1.3


flutter:
  uses-material-design: true

  assets:
    - lib/core/assets/images/
    - lib/core/assets/sounds/

  fonts:
    - family: Cera Pro
      fonts:
        - asset: lib/core/assets/fonts/Cera-Pro-Bold.otf
        - asset: lib/core/assets/fonts/Cera-Pro-Medium.otf
